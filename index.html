<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-Body Problem Simulation</title>
  <meta name="description" content="An interactive 3D gravitational simulation of the famous three-body problem, built with Three.js. 25 periodic-orbit and classical presets, each numerically verified.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container"></div>

  <div id="boot-error" hidden>
    <div class="boot-card">
      <div class="boot-title">Three-Body Problem</div>
      <div class="boot-msg"></div>
    </div>
  </div>

  <div id="ui">
    <div class="title">Three-Body Problem <span style="font-size:9px;padding:2px 8px;border:1px solid rgba(255,255,255,.2);border-radius:3px;color:#34d399;text-transform:uppercase;letter-spacing:1px;margin-left:8px">Made by Mayank</span></div>

    <div class="panel-nav">
      <span class="panel-nav-label">Simulation</span>
      <a class="panel-link" href="learn.html">Orbits &amp; theory &rarr;</a>
    </div>

    <div id="tab-simulation" class="tab-content active">
      <div class="controls">
        <button id="pauseBtn" title="Play/Pause">⏸</button>
        <button id="resetBtn" title="Reset">↺</button>
        <button id="perturbBtn" title="Perturb (nudge to see chaos)">⟳</button>

        <select id="presetSelect"></select>

        <div class="control-group">
          <label for="speedSlider">Speed</label>
          <input type="range" id="speedSlider" min="1" max="100" step="1" value="41">
          <span id="speedLabel">1.0×</span>
        </div>

        <label class="toggle"><input type="checkbox" id="trailToggle" checked> Trails</label>
        <label class="toggle"><input type="checkbox" id="autoRotateToggle"> Orbit</label>
      </div>

      <div class="energy">
        <span>KE <span id="keValue">0.0000</span></span>
        <span class="sep">|</span>
        <span>PE <span id="peValue">0.0000</span></span>
        <span class="sep">|</span>
        <span>E <span id="totalValue">0.0000</span></span>
      </div>

      <div class="info">Drag orbit · Scroll zoom · Space pause · R reset · P perturb</div>
    </div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
  <script>
    (function () {
      var overlay = document.getElementById('boot-error');
      function show(html) {
        overlay.querySelector('.boot-msg').innerHTML = html;
        overlay.hidden = false;
      }
      if (location.protocol === 'file:') {
        show(
          '<strong>This page needs a local server.</strong><br><br>' +
          'Browsers block JavaScript modules on <code>file://</code>, so the simulation ' +
          'cannot start when <code>index.html</code> is opened by double-clicking it.<br><br>' +
          'On macOS, double-click <code>start.command</code>.<br>' +
          'Or run <code>python3 -m http.server 8000</code> in this folder, ' +
          'then open <code>http://localhost:8000</code>.'
        );
        return;
      }
      setTimeout(function () {
        if (window.__APP_READY) return;
        show(
          '<strong>The simulation did not start.</strong><br><br>' +
          'Open the browser console for the error. If it mentions a MIME type, ' +
          'serve this folder with <code>python3 -m http.server 8000</code> ' +
          'instead of a file viewer.'
        );
      }, 3000);
    })();
  </script>
</body>
</html>
